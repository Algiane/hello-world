job1:
  script:
    - echo "This is job 1"
    - exit 1  # Simulating failure
  allow_failure: true

job2:
  script:
    - echo "This is job 2"
    - exit 0  # Simulating success

job3:
  script:
    - echo "This is job 3"
    - exit 1  # Simulating failure
  allow_failure: true

trigger_on_failure_job:
  script:
    - echo "At least one of the previous jobs failed, triggering this job"
  rules:
    - if: '$CI_JOB_STATUS == "failed"'  # Check if the job failed
      when: always
  needs:
    - job1
    - job2
    - job3
