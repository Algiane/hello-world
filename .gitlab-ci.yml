.push_on_main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        VAR: "coucou"

.mr:
  rules:
    - if: '$CI_MERGE_REQUEST_ID'        # Run the pipeline for merge requests

job1:
  rules:
    - !reference [.mr, rules]
  script:
    - echo "This job run for MR only with var value $VAR"
  allow_failure: true

job2:
  rules:
    - !reference [.push_on_main, rules]
    - !reference [.mr, rules]

  dependencies:
    - job1

  script:
    - echo $CI_COMMIT_BRANCH
    - echo $CI_DEFAULT_BRANCH
    - echo $CI_COMMIT_REF_NAME
    - echo "This job run for MR and push in main with var value $VAR."
