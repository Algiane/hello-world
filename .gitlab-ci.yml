stages:          # List of stages for jobs, and their order of execution
  - configure
  - build
  - test
  - coverage
  - deploy

variables:
  BUILD_DIR: build-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
  COVERAGE_DIR: $BUILD_DIR/coverage
  SRC_DIR: src
  TEST_LIST_FILES: |
    file1.txt
    file2.txt
    file3.txt
  ERR: |

    2

conf:
  stage: configure
  tags: ['ci.inria.fr', 'small'] # Inria's shared runners
  image: ubuntu:latest
  script:
    - echo "VAR=toto" | tee conf.env
    - mkdir my_dir
    - mkdir my_dir/dir2
    - readarray -t FILES <<< "$TEST_LIST_FILES"
    - readarray -t ERRS <<< "$ERR"
    - echo "Array var:"" ${FILES[@]}"
    - echo "Array err:"" ${ERRS[@]}"

  artifacts:
    expire_in: 1 hour
    paths:
      - my_dir

    reports:
      dotenv: conf.env

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  tags: ['ci.inria.fr', 'small'] # Inria's shared runners
  image: ubuntu:latest # By default, an image of busyBox (minimal linux with no package manager and no compiler) is loaded 



  script:
    - echo "Compiling the code..."
    - apt update -y
    - apt install g++ libopenmpi-dev gcovr -y
    - mkdir -p $BUILD_DIR
    - gcc -D BRANCH_1 -O0  -fPIC --coverage -g -O0 -o $BUILD_DIR/a.out $SRC_DIR/*.c
    - echo "Compile complete."
    - cd $BUILD_DIR && pwd
    - ./a.out 2 5
    - ./a.out 5 2
    - cd -
    - ls $BUILD_DIR
    - mkdir -p $COVERAGE_DIR
    - mkdir -p $COVERAGE_DIR/cobertura
    - mkdir -p $COVERAGE_DIR/html
    - >-
     echo "gcovr $BUILD_DIR -r . --exclude-unreachable-branches --print-summary --txt
     --cobertura-pretty --cobertura $COVERAGE_DIR/cobertura/coverage.xml"

    - >-
     gcovr -v $BUILD_DIR -r . --exclude-unreachable-branches --print-summary --txt
     --cobertura-pretty --cobertura $COVERAGE_DIR/cobertura/coverage.xml
     --html-details --html $COVERAGE_DIR/html/coverage.html


  coverage: '/^TOTAL.*\s+(\d+\%)$/'

  artifacts:
    name: ${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHA}
    when: always
    expire_in: 1 hour
    paths: [$COVERAGE_DIR/html]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: $COVERAGE_DIR/cobertura/coverage.xml


