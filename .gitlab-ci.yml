job1:
  script:
    - echo "This is job 1"
    - exit 1  # Simulating failure
  allow_failure: true

job2:
  script:
    - echo "This is job 2"
    - exit 0  # Simulating success

job3:
  script:
    - echo "This is job 3"
    - exit 1  # Simulating failure
  allow_failure: true

trigger_on_failure_job:
  script:
    - echo "At least one job failed, triggering this job"
  when: on_failure  # Runs if any previous job fails
  needs:
    - job1
    - job2
    - job3
