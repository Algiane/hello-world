stages:
  - build
  - test

build:
  stage: build

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*

  parallel:
    matrix:
      - RUNNER: [macosx,linux]
  tags:
    - ${RUNNER}
  script:
    - echo "Compilation sur $RUNNER"

test:
  stage: test
  parallel:
    matrix:
     - RUNNER: [macosx,linux]
  tags:
    - ${RUNNER}
  needs:
    - job: build
      parallel:
        matrix:
          - RUNNER: ['$[[ matrix.RUNNER ]]']

  script:
    - echo "Tests sur $RUNNER, dépendant de la compilation $RUNNER"
