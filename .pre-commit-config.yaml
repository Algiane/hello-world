repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

    -   id: end-of-file-fixer
    -   id: check-added-large-files

# Check code style (indentations, line breaks, etc..)
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.4
    hooks:
    -   id: clang-format
        entry: bash -c 'git diff -U0 --no-color --staged -- "$@" | clang-format-diff.py -style file -p1 -i' --

# propose commit message title style ('<branch_name>: ...')
-   repo: local
    hooks:
      - id: prepare-commit-msg
        name: prepare-commit-msg
        entry: ./scripts/preCommitHooks/prepare-commit-msg.sh
        language: script
        stages: [prepare-commit-msg]

 # check commit message title style ('<branch_name>: ...')
-   repo: local
    hooks:
      - id: commit-msg
        name: check-commit-msg
        entry: ./scripts/preCommitHooks/commit-msg.sh
        language: script
        stages: [commit-msg]

# check common words misspellings
-   repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
