name: ci

on:
  # run tests on push events
  push:
  # run tests on PR events
  pull_request:
    types: [opened, synchronize]

  workflow_dispatch:


jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
        fail-fast: false
        matrix:
            os: [ubuntu-latest]
            #branch: [BRANCH_1,BRANCH_2]

    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-world

      - uses: actions/setup-python@v7
        with:
          python-version-file: './doc/doc2/.python-version' 
          cache: 'pip' # caching pip dependencies
      - name: doc
        run: |
          python3 --version
          pip install -r doc/doc2/requirements.req

      - name: compilation
        if: matrix.os == 'ubuntu-20.04'
        run: |
          #gcc -D ${{ matrix.branch }} -O0 -fprofile-arcs -ftest-coverage hello-world/hello-world.c
          gcc -D BRANCH_1 -O0 -fprofile-arcs -ftest-coverage hello-world/hello-world.c
          ./a.out 2 1

      - name: install and use lcov
        run: |
          sudo apt install -y lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          root_dir: .
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

